<header><h1>Created Training — William McNeely</h1><div class="sub" id="hdr"></div></header><main id="app"></main>

<script>
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MAIN={0:0,1:1,3:2,4:3};// day -> cycle column
const CYCLE=[
['Max Effort Lower 1','DE/RE Upper 1','RE Lower 2','Max Effort Upper 2'],
['Max Effort Lower 3','DE/RE Upper 3','DE Lower 1 Speed','Max Effort Upper 1'],
['Max Effort Lower 2','DE/RE Upper 2','DE Lower 3 Speed','Max Effort Upper 3'],

['Max Effort Lower 1','DE/RE Upper 1','DE Lower 2 Speed Plus','Max Effort Upper 2'],
['Max Effort Lower 3','DE/RE Upper 3','DE Lower 1 Speed Plus','Max Effort Upper 1'],
['Max Effort Lower 2','DE/RE Upper 2','DE Lower 3 Speed Plus','Max Effort Upper 3'],
['Deload Lower','Deload Upper','Deload Lower','Deload Upper']];

const INTENS=['H','MH','L','H','MH','L','L'];

'Lower 2':['Glutes [Med]','LegPress OR Split Squat','Deadlift [@]','Rotation','Quads','Hip Adduction','Ab Flexion/Brace','Ankle'],
'Lower 3':['Glutes [Max]','Squat [@]','Deadlift','Hip Abduction','Reverse Ab Flexion','Spinal','Ab Flexion [Diagonals]','Hip [R]'],
'Upper 1':['BenchPress','Row','Shoulder ER','Neck [LF]','Serratus (Iron-Cross)','Lateral Delts','Reverse EF','Triceps [M-S]','Wrist [E/F]','Crushing (Closed: Gripper)','Extensors'],

'Speed':['Jump/Throw','Agility','Lateral Flexion','Skips','Hill Sprints','Parachute','Barefoot?','CARs','Capsule','Rotational','Linear','Movement'],
'Explosive':['Jump','Olympic','Lower HITT: Jump Rope','Lower HITT: Ski Erg','Lower HITT: Short Sprint (HITTmill)','Upper HITT: Rower','Upper HITT: Boxing','Upper HITT: Bulgarian DB Complex','Upper HITT: Long Sprint','Upper HITT: PushUp/Burpee/Punch','Cardiac/VO2: Walking Pacer Test'],

'Hike':['Explore'],
'Deload':['Easy movement / reduced load version of the scheduled lift']};
const VARS={"Lower 1": [["Power lifts (On Sundays)", ["Barbell Snatch", "OA DB Snatch", "Weighted Box Jumps"]], ["Squat", ["Super Squat Bar, -90#Band", "Super Squat Machine, Facing Toward, -100#Band", "GCB, +120#Chain"]], ["PC", ["45\u00b0 Hip Extension Machine, Cable, DS", "Seated Hip Extension Machine, DS", "Inverted Leg Curl Machine"]], ["Lateral Flexion", ["CorePAD Side Crunch", "HLR Side Crunch Variation"]], ["Quad [SL or Lengthened]", ["Deep Pistol Squat, on Box", "Lying Leg Extensions, Cable", "Banded TKE's", "Walking Lunges", "Elevated Bulgarian Split Squats"]], ["Hip Flexion", ["OL Standing Hip Flexion Machine", "OL Supine Cable Hip Flexion", "OL Standing Cable Hip Flexion, Lengthened Focused"]], ["Hamstrings", ["Seated Leg Curl Machine, DS", "Prone Leg Curl Machine, DS"]], ["Calves", ["Calve Press on Seated Leg Press Machine", "Seated Calve Raise Machine", "Standing Calve Raise Machine"]], ["Ab Flexion [Inv]", ["Kneeling Cable Crunches", "GHR SitUp Crunches"]]], "Lower 2": [["Power lifts (On Sundays)", ["Barbell Snatch", "OA DB Snatch", "Weighted Box Jumps"]], ["Glutes [Med]", ["OL Standing Cable Kickback, PS", "OL Standing Cable Pressback, PS", "OL Standing Hip Machine Extension, PS", "OL Glute Drive Machine"]], ["Leg Press", ["45\u00b0 Leg Press Machine, -90#Band", "OL 45\u00b0 Leg Press Machine, -90#Band", "OL Super Squat Machine Bulgarian Split Squats"]], ["Deadlift [Assist]", ["Barbell RDL, -90#Band", "TrapBar SL Deadlift, DS", "Barbell Deadlift, +80Chain"]], ["Rotation", ["Seated Lower Machine, DS", "Seated PureTorque, PS, DS", "Seated Upper Machine, DS", "Seated UpperArm Machine, DS"]], ["Quads", ["Seated Leg Extension Machine, DS", "Sissy Squats"]], ["Hip Adduction", ["Seated Machine, DS", "OL Standing Cable, PS"]], ["Ab Flexion [Brace]", ["Seated Ab Machine, ISO", "Ab Wheel Rollouts", "Cable Deadbug Reverse Crunch"]], ["Ankle", ["Seated Tibialis Machine", "Seated Lateral Aaron Maates Machine"]]], "Lower 3": [["Power lifts (On Sundays)", ["Barbell Snatch", "OA DB Snatch", "Weighted Box Jumps"]], ["Glutes", ["Nautilus Glute Drive Machine, DS", "Nautilus 2ST Hip Extension Machine, DS"]], ["Squat [Assist]", ["Super Squat Bar Deep Olympic Squat, -90#Band", "Super Squat Machine, Facing Away, Deep Squat, -100#Band", "GCB Deep Squat, +120#Chain"]], ["Deadlift", ["TrapBar Rack Pull, -90#Band", "Barbell Deadlift, DS"]], ["Hip Abduction", ["Seated Machine, Hips Extended, PS, DS", "Seated Machine, Hips Flexed, PS, DS", "OL Standing Cable, PS", "OL SideLying Table"]], ["Reverse Ab Flexion", ["45\u00b0 Decline CorePad Reverse Crunch", "Hanging Knee Raises, PS"]], ["Spinal", ["Seated Low Back Machine, PS, DS", "CorePAD Low Back Crunch, PS", "Spinal Extension on 45\u00b0 Machine"]], ["Ab Flexion [Diagonals]", ["OS Seated Machine", "OS CorePAD Diagonal Crunches", "OS Reverse CorePAD Diagonal Crunches"]], ["Hip [R]", ["OL Standing Cable, PS"]]], "Upper 1": [["Bench Press", ["Kabuki Bar, -90#Band", "Barbell Floor Press, +120Chain", "Football Bar, -90#Band, DS", "Seated DualCable Bench Press", "Flat DB BP"]], ["Row", ["Seated Cybex Machine Row, DS", "OA Seated Cybex Machine Row, DS", "OA DB Row, DS", "Barbell Row, DS"]], ["Shoulder ER", ["OA Standing Cable", "OA Standing Cable, Arm Abducted, PS"]], ["Neck [LF]", ["Seated Machine", "OS Supine sternocleidomastoid Crunch"]], ["Serratus", ["Supine DB Pullover", "DualHCable Crossover", "Dual Cable IronCross", "Supine Barbell Pullover to Bench Press", "Serratus PushUps"]], ["Lateral Delts", ["Seated Machine", "Seated DualXCable Lateral Raises w/ Ab Support", "OA Standing Cable Raises", "OA Seated Lateral Raises w/ Chest Support", "Standing Dual DB Lateral Raises, S(Abs)"]], ["Reverse EF", ["OA 45\u00b0 DB Hammer Curls on 45\u00b0 Hip Machine", "Standing Cable EZBar Reverse Curls, Facing Toward", "Barbell Preacher Curl Reverse Curls", "Standing Cable StaightBar Reverse Curls, Facing Away"]], ["Triceps [M-S]", ["Standing Cable Rope Pressdowns", "Standing Cable EZBar Pressdowns, Dip Belt Support", "Incline Cable Pressdowns"]], ["Wrist [E/F]", ["Standing Grip Machine", "Standing Gripnado Roller"]], ["Crushing (Closing)", ["Titan's Telegraph Key", "Standing Grip Machine", "Captain's of Crush Grippers"]], ["Extensors", ["Rubberband Extension"]]], "Upper 2": [["Press", ["Seated Football Bar Overhead Press, -90#Band, DS", "Seated Machine Overhead Press, Facing Toward, DS", "Standing Barbell Press, DS"]], ["Pulls", ["Weighted Pullups", "Seated Pulldown Machine, DS", "Seated Cable Pulldowns, DS", "OA Seated Pulldown Machine, DS"]], ["Bench Press [Assist]", ["Seated ChestPress Machine, DS", "Standing DualCable Horizontal Press", "15\u00b0 Incline DB Bench Press", "Chaos Bench Press"]], ["Rear Delts", ["Seated Machine, +Band, PS, DS", "OA Standing XCable Flye, PS, DS", "Supine Incline DualXCable Flyes, DS", "OA Internally Rotated Swim Flyes"]], ["Neck [R]", ["OS Standing Towel Rotation", "OS Standing Iron Neck Rotation"]], ["Shoulder IR", ["OA Standing Cable", "OA Biceps Machine, Arm Wrestle", "OA Stretch/Contract"]], ["Biceps [L-M]", ["Standing DualCable Curls, Facing Away, PS, DS", "OA Standing Cable Curl, Arm Extended and Ext Rot", "Seated Alt DB Bicep Curls"]], ["Triceps [Press]", ["Seated Keiser Machine Dips, PS, DS", "Triceps Dips", "Seated Triceps Machine, DS"]], ["Wrist [rF/uF]", ["OA Standing Grip Machine", "Standing Gripnado Roller"]], ["Crushing (Isometric)", ["OA Rolling Thunder", "OA PullUp Bar Hang"]], ["Extensors", ["Rubberband Extension"]]], "Upper 3": [["Incline", ["Seated Incline Machine, CloseGrip, DS", "Seated Incline Machine, WideGrip, DS", "45\u00b0 Incline Barbell Press, -90#Band", "45\u00b0 Incline FootballBar Press, -90#Band", "45\u00b0 Smith Machine Incline Press"]], ["UpperBack", ["Seated Cybex Machine Row, Elbows Out, PS, DS", "OA Seated Cybex Machine Row, Elbows Out, PS, DS", "TrapBar Barbell Row, DS", "Seated DualCable Row, Elbows Out, PS(Preacher)"]], ["Chest", ["Standing DualCable Flyes, Cuff/Handle Combo", "OA Standing Cable PressAround", "30\u00b0 Incline DualCable Flyes"]], ["Lats [M-S]", ["OA Standing HCable PullArounds, PS", "OA Standing HCable PullDowns, PS", "Seated Pullover Machine, PS", "OA Gravitron Machine Pullups"]], ["Neck [F/E]", ["Seated Machine"]], ["Front Delts", ["OA Standing LCable Side Turn", "Prone Incline Dual DB Raises"]], ["Traps", ["Standing DualLCable Shrugs, PS", "Standing TrapBar Shrugs"]], ["Biceps [M-S]", ["OA Prone LCable Rogue Curls", "OA Standing HCable Curls, PS", "Standing DualHCable Curls, S(Chest)", "Preacher Curls"]], ["Triceps [L-M]", ["OA Standing LCable Overhead Extension", "SupineBench Cable EZBar Triceps Extension", "Seated Machine"]], ["Wrist [S/P]", ["OA Standing Grip Machine"]], ["Pinching (Open: Hub)", ["OA Bumper Plate Hold"]], ["Extensors", ["Rubberband Extension"]]]};
for(const t in VARS)EX[t]=VARS[t].map(x=>x[0]);
const DEF={start:'2026-10-11',w4swap:false,offset:0};
let S=Object.assign({},DEF,JSON.parse(localStorage.ct_settings||'{}'));let LOG=JSON.parse(localStorage.ct_log||'{}');let view='today';let override=null;
const save=()=>{localStorage.ct_settings=JSON.stringify(S);localStorage.ct_log=JSON.stringify(LOG)};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[a,b,c]=s.split('-');return new Date(a,b-1,c)}
function infoFor(date){const st=parse(S.start);let days=Math.round((date-st)/864e5)+S.offset;const wk=((Math.floor(days/7)%8)+8)%8;const dow=date.getDay();
 let sess=null;if(MAIN[dow]!=null){sess=CYCLE[wk][MAIN[dow]];if(wk==3&&dow==4&&S.w4swap)sess='Deload Upper';}const sched=sess;const k=ymd(date);const ov=S.ov&&k in S.ov;if(ov)sess=S.ov[k]||null;return{wk:wk+1,dow,sess,sched,ov,date}}
const SESSIONS=[];['Max Effort','DE/RE','RE','DE','Deload'].forEach(t=>['Lower','Upper'].forEach(b=>{if(t=='Deload'){SESSIONS.push('Deload '+b);return}[1,2,3].forEach(n=>SESSIONS.push(t+' '+b+' '+n))}));[1,2,3].forEach(n=>{SESSIONS.push('DE Lower '+n+' Speed');SESSIONS.push('DE Lower '+n+' Speed Plus')});
function setOv(k,v){S.ov=S.ov||{};if(v=='__reset')delete S.ov[k];else S.ov[k]=v==='__rest'?'':v;const L=LOG[k];if(L)L.sess=infoFor(parse(k)).sess;save();render()}
function cls(s){if(!s)return'off';if(/Deload/.test(s))return'del';if(/Max/.test(s))return'max';if(/Speed|DE Lower/.test(s))return'de';if(/^RE/.test(s))return're';if(/Upper/.test(s))return'up';return'off'}
function block(s){const m=s.match(/(Lower|Upper) (\d)/);return m?m[1]+' '+m[2]:null}
function exList(s){if(!s)return[];if(/Deload/.test(s))return EX.Deload;let l=[...(EX[block(s)]||[])];if(/Speed/.test(s))l=l.concat(EX.Speed.map(x=>'Speed: '+x));return l}
function lastFor(name,before,v){const ks=Object.keys(LOG).filter(k=>k<before).sort().reverse();for(const k of ks){const e=LOG[k].ex&&LOG[k].ex[name];if(e&&(e.v||'')==(v||'')&&e.sets.some(x=>x.w||x.r))return k+': '+e.sets.filter(x=>x.w||x.r).map(x=>x.w+'×'+x.r).join(', ')}return''}
function varsFor(blk,slot){const f=(VARS[blk]||[]).find(x=>x[0]==slot);return(f?f[1]:[]).concat((S.custom&&S.custom[slot])||[])}
function pickVar(k,blk,n,el){const v=el.value;const e=LOG[k].ex[n];if(v=='__add'){const x=prompt('New exercise for '+n+':');if(x&&x.trim()){S.custom=S.custom||{};(S.custom[n]=S.custom[n]||[]).push(x.trim());e.v=x.trim()}}
 else if(v=='__del'){const c=(S.custom&&S.custom[n])||[];const x=prompt('Type the custom exercise to remove:\n'+c.join('\n'));if(x&&c.includes(x.trim())){S.custom[n]=c.filter(y=>y!=x.trim());if(e.v==x.trim())e.v=''}}else e.v=v;save();render()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function today(){const d=override||new Date();d.setHours(0,0,0,0);const I=infoFor(d);const key=ymd(d);const L=LOG[key]=LOG[key]||{sess:I.sess,wk:I.wk,ex:{},chk:{},notes:''};L.sess=I.sess;
 let h=`<div class="card stick"><div class="sub">${DAYS[I.dow]} ${key} · Week ${I.wk} of 8 · Intensity ${INTENS[I.dow]}</div><h2 style="margin:8px 0"><span class="tag ${cls(I.sess)}">${I.sess||'No main session'}</span></h2>
 ${I.wk==4&&I.dow==4&&!S.w4swap?`<div class="note">${W4NOTE}</div>`:''}
 <select id="sessSel" onchange="setOv('${key}',this.value)"><option value="__reset">↺ Scheduled: ${I.sched||'Rest/Extras only'}</option><option value="__rest" ${I.ov&&!I.sess?'selected':''}>Rest/Extras only</option>${SESSIONS.map(x=>`<option ${I.ov&&I.sess==x?'selected':''}>${x}</option>`).join('')}</select>${I.ov?'<div class="sub">Changed from scheduled: '+(I.sched||'Rest')+'</div>':''}
 <button class="b" onclick="shift(-1)">◀ Prev day</button><button class="b" onclick="shift(1)">Next day ▶</button>${override?'<button class="b" onclick="override=null;render()">Back to today</button>':''}</div>`;
 h+=`<div class="card"><b>Warm-up</b><div class="sub">${WARMUP.join(' · ')}</div></div>`;
 const ex=exList(I.sess);if(ex.length){h+='<div class="card"><b>Exercises</b>';ex.forEach(n=>{const e=L.ex[n]=L.ex[n]||{sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}],n:''};const blk=block(I.sess);const vs=varsFor(blk,n);const lt=lastFor(n,key,e.v);const cu=(S.custom&&S.custom[n])||[];const jn=JSON.stringify(n).replace(/"/g,'&quot;');const sel=blk&&!/Deload/.test(I.sess)&&!/^Speed:/.test(n)?`<select onchange="pickVar('${key}','${blk}',${jn},this)"><option value="">— choose variation —</option>${vs.map(x=>`<option ${e.v==x?'selected':''}>${esc(x)}</option>`).join('')}${e.v&&!vs.includes(e.v)?`<option selected>${esc(e.v)}</option>`:''}<option value="__add">+ Add new exercise…</option>${cu.length?'<option value="__del">− Remove custom exercise…</option>':''}</select>`:'';
  h+=`<div class="ex"><b class="${/^Power/.test(n)?'pl':''}">${esc(n)}</b>${sel}${lt?`<div class="last">Last: ${esc(lt)}</div>`:''}`+e.sets.map((s,i)=>`<div class="set">${i+1}<input inputmode="decimal" placeholder="lb" value="${esc(s.w)}" oninput="setv('${key}',${JSON.stringify(n).replace(/"/g,'&quot;')},${i},'w',this.value)">×<input inputmode="numeric" placeholder="reps" value="${esc(s.r)}" oninput="setv('${key}',${JSON.stringify(n).replace(/"/g,'&quot;')},${i},'r',this.value)"></div>`).join('')+
  `<button class="b" onclick="addset('${key}',${JSON.stringify(n).replace(/"/g,'&quot;')})">+ set</button></div>`});h+='</div>'}
 h+='<div class="card"><b>Day extras</b>'+EXTRAS[I.dow].concat(DAILY).map(x=>`<label class="chk"><input type="checkbox" ${L.chk[x]?'checked':''} onchange="LOG['${key}'].chk['${x}']=this.checked;save()">${x}</label>`).join('')+'</div>';
 h+=`<div class="card"><b>Notes</b><textarea style="width:100%;height:90px" oninput="LOG['${key}'].notes=this.value;save()">${esc(L.notes)}</textarea></div>`;return h}
function setv(k,n,i,f,v){LOG[k].ex[n].sets[i][f]=v;save()}function addset(k,n){LOG[k].ex[n].sets.push({w:'',r:''});save();render()}
function shift(n){const d=override||new Date();override=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);render()}
function week(){const t=new Date();t.setHours(0,0,0,0);const s=new Date(t);s.setDate(t.getDate()-t.getDay());const I=infoFor(t);let h=`<div class="card"><b>Week ${I.wk} of 8</b></div>`;
 for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const J=infoFor(d);h+=`<div class="card" onclick="override=new Date(${d.getTime()});view='today';render()"><div class="sub">${DAYS[i]} ${ymd(d)} · ${INTENS[i]}${i==t.getDay()?' · TODAY':''}</div>${J.sess?`<span class="tag ${cls(J.sess)}">${J.sess}</span>`:''}${J.ov?' <span class="sub">(changed)</span>':''}<div class="sub">${EXTRAS[i].join(' · ')}</div></div>`}return h}
function cycle(){const cur=infoFor(new Date()).wk;let h='<div class="card"><table><tr><th>Wk</th><th>Sun</th><th>Mon</th><th>Wed</th><th>Thu</th></tr>';
 CYCLE.forEach((r,w)=>{h+=`<tr style="${w+1==cur?'outline:2px solid #fff':''}"><td>${w+1}</td>`+r.map((s,j)=>{if(w==3&&j==3&&S.w4swap)s='Deload Upper';return`<td class="${cls(s)}" style="color:#111">${s}</td>`}).join('')+'</tr>'});
 return h+'<tr><td>9</td><td colspan=4>Back to Week 1</td></tr></table><div class="note">* Week 2 starts with Lower 3, then back to 1 on the next lower day (from your sheet). Week 1 Wednesday is RE Lower 2 (not DE).</div></div>'}
function hist(){const ks=Object.keys(LOG).filter(k=>{const L=LOG[k];return L.notes||Object.values(L.chk||{}).some(Boolean)||Object.values(L.ex||{}).some(e=>e.sets.some(s=>s.w||s.r))}).sort().reverse();
 if(!ks.length)return'<div class="card">No logged sessions yet.</div>';return ks.map(k=>{const L=LOG[k];return`<div class="card" onclick="override=parse('${k}');view='today';render()"><div class="sub">${k} · Week ${L.wk}</div><span class="tag ${cls(L.sess)}">${L.sess||'Extras'}</span>`+
 Object.entries(L.ex).filter(([n,e])=>e.sets.some(s=>s.w||s.r)).map(([n,e])=>`<div class="sub">${esc(n)}${e.v?' — '+esc(e.v):''}: ${e.sets.filter(s=>s.w||s.r).map(s=>s.w+'×'+s.r).join(', ')}</div>`).join('')+(L.notes?`<div class="sub">📝 ${esc(L.notes)}</div>`:'')+'</div>'}).join('')}
function settings(){return`<div class="card"><b>Cycle start date (Week 1 Sunday)</b><br><input type="date" value="${S.start}" onchange="S.start=this.value;save();render()"></div>
<div class="card"><b>Manual adjust</b><div class="sub">Shift the cycle by days (current: ${S.offset})</div><button class="b" onclick="S.offset-=7;save();render()">−1 week</button><button class="b" onclick="S.offset+=7;save();render()">+1 week</button><button class="b" onclick="S.offset=0;save();render()">Reset</button></div>
<div class="card"><label class="chk"><input type="checkbox" ${S.w4swap?'checked':''} onchange="S.w4swap=this.checked;save();render()">Week 4 Thursday → Deload Upper (sheet says Max Effort Upper 2)</label></div>
<div class="card"><b>Backup</b><br><button class="b p" onclick="exp()">Export JSON</button><button class="b" onclick="document.getElementById('imp').click()">Import JSON</button><input type="file" id="imp" accept=".json" style="display:none" onchange="imp(this)"></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:S,log:LOG},null,1)],{type:'application/json'}));a.download='training-log-'+ymd(new Date())+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(o.log)LOG=Object.assign(LOG,o.log);if(o.settings)S=Object.assign(S,o.settings);save();alert('Imported');render()})}
function render(){const I=infoFor(new Date());document.getElementById('hdr').textContent=`Week ${I.wk} of 8 · today: ${I.sess||'extras / recovery'}`;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
 document.getElementById('app').innerHTML={today,week,cycle,hist,set:settings}[view]();save()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view!='today')override=null;render();scrollTo(0,0)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
